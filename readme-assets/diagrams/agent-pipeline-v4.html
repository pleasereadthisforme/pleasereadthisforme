<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent pipeline — v4</title><style>body{margin:0;background:#f3f3f3}main{max-width:1350px;margin:24px auto}svg{display:block;width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" role="img" aria-labelledby="title desc"><title id="title">Agent pipeline — layout v4</title><desc id="desc">A bounded model loop selects file exploration, optional semantic search, or source reading. Read evidence feeds the next decision. The final answer is checked for allowed citation references.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#777" /></marker><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#181818}.title{font-size:30px;font-weight:600}.label{font-size:16px;font-weight:600}.sub{font-size:12px;fill:#666}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;fill:#666}.edge{fill:none;stroke:#777;stroke-width:1.5;marker-end:url(#arrow)}.node{fill:white;stroke:#bbb;stroke-width:1}.dark{fill:#181b18;stroke:#181b18}.light{fill:#fff}.note{font-size:15px;fill:#666}</style></defs><rect width="1350" height="960" fill="white" /><text x="48" y="48" class="mono">PLEASE READ THIS FOR ME  /  AGENT PIPELINE</text><text x="48" y="98" class="title">Explore. Read. Build an answer.</text><path d="M48 124H1302" stroke="#dedede" /><text x="48" y="890" class="note">Semantic search covers enabled files only. A user can explicitly request it first.</text><text x="48" y="917" class="note">Citation-reference checks do not verify every factual claim.</text><g transform="translate(150 0)"><path d="M345 210H430" class="edge" /><path d="M540 250V345H290V380" class="edge" /><path d="M650 250V345H890V380" class="edge" stroke-dasharray="5 5" /><path d="M290 500V545H480V580" class="edge" /><path d="M890 523V545H720V580" class="edge" /><path d="M395 625H40V270H465V250" class="edge" /><path d="M605 170V145H1155V725H520V750" class="edge" /><path d="M690 790H750" class="edge" /><rect x="70" y="170" width="275" height="80" rx="6" class="node " /><text x="90" y="200" class="label">Question + context</text><text x="90" y="227" class="sub">Recent turns · verified prior evidence</text><rect x="430" y="170" width="350" height="80" rx="6" class="node dark" /><text x="450" y="200" class="label light">Choose the next action</text><text x="450" y="227" class="sub light">Model selects a tool or finishes</text><text x="100" y="322" class="mono">DEFAULT: FILE EXPLORATION</text><text x="670" y="322" class="mono">OPTIONAL: FILL AN EVIDENCE GAP</text><rect x="70" y="380" width="440" height="120" rx="6" class="node " /><text x="90" y="410" class="label">Find files and search content</text><text x="90" y="437" class="sub">find · glob · rg · grep</text><text x="90" y="460" class="sub">File paths and matching lines are candidates.</text><rect x="660" y="380" width="440" height="143" rx="6" class="node " /><text x="680" y="410" class="label">Search by meaning</text><text x="680" y="437" class="sub">Agent writes query → OpenAI embedding</text><text x="680" y="460" class="sub">LanceDB: active generations · cosine distance</text><text x="680" y="483" class="sub">Validate candidate revision and text hash.</text><rect x="395" y="580" width="420" height="95" rx="6" class="node " /><text x="415" y="610" class="label">Read the relevant passages</text><text x="415" y="637" class="sub">sed · read_file</text><text x="415" y="660" class="sub">Successful reads provide citation evidence.</text><text x="70" y="690" class="mono">REPEAT WITH THE RESULTS</text><text x="70" y="715" class="note">Tools are chosen as needed; this is not a fixed checklist.</text><text x="835" y="700" class="mono">ANSWER READY / EXECUTION LIMIT</text><rect x="350" y="750" width="340" height="90" rx="6" class="node " /><text x="370" y="780" class="label">Compose + check references</text><text x="370" y="807" class="sub">Only delivered evidence IDs may be cited.</text><rect x="750" y="750" width="350" height="90" rx="6" class="node " /><text x="770" y="780" class="label">Return the result</text><text x="770" y="807" class="sub">Answer + sources, or a reference warning.</text></g><text x="48" y="194" class="mono">01</text><text x="48" y="219" class="mono">CONTEXT</text><text x="48" y="405" class="mono">02</text><text x="48" y="430" class="mono">DISCOVERY</text><text x="48" y="605" class="mono">03</text><text x="48" y="630" class="mono">EVIDENCE</text><text x="48" y="775" class="mono">04</text><text x="48" y="800" class="mono">RESPONSE</text></svg></main></html>
